<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bo Playground</title>
<script>
// Set the theme before the first paint: the saved choice, else the system setting.
(() => {
  let theme = null;
  try { theme = localStorage.getItem("bo-theme"); } catch (error) { /* storage can be blocked */ }
  if (theme !== "light" && theme !== "dark")
    theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = theme;
})();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="layout" class="layout">
  <aside id="editor-panel" class="sidebar" aria-label="Editor">
    <div id="editor-content" class="sidebar-content" inert>
      <div class="sidebar-inner">
        <div class="toolbar" role="toolbar" aria-label="Debugger controls">
          <button id="step" title="Execute the next step (F10)">Step</button>
          <select id="mode" aria-label="Step size" title="What one step is">
            <option value="words">word</option>
            <option value="over">word, over calls</option>
            <option value="lines">line</option>
            <option value="user">line + user words</option>
          </select>
          <button id="run" class="primary" title="Run to the end (Ctrl+Enter)">Run<svg class="bolt" viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="currentColor"/></svg></button>
          <button id="stop" title="Pause a running program" disabled>Stop</button>
          <button id="restart" title="Reset the machine and load the program">Restart</button>
          <button id="abort" title="Drop the loaded program, keeping the stacks">Abort</button>
          <button id="kill" class="danger" title="The machine does not respond: replace it" hidden>Restart machine</button>
        </div>
        <div id="editor" class="editor" aria-label="Source code"></div>
        <div class="editor-foot"><button id="editor-clear" class="link" type="button" title="Empty the editor">Clear</button></div>
        <h2>Next</h2>
        <div id="next"></div>
        <h2>Running <span class="subtle" title="A word called last in a list replaces its caller (a tail call), so fewer levels show than the source nests">innermost first</span></h2>
        <div id="frames"></div>
      </div>
    </div>
    <div id="resizer" class="resizer" role="separator" aria-orientation="vertical" aria-label="Resize the editor"
         title="Drag to resize (double-click: default width)" tabindex="0" hidden></div>
    <button id="editor-toggle" class="edge-tab" type="button" aria-controls="editor-content" aria-expanded="false"
            aria-label="Show the editor" title="Show or hide the editor">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </aside>

  <div class="page">
    <header class="top">
      <span class="spacer"></span>
      <label class="example">
        <span class="sr-only">Example or puzzle</span>
        <select id="example">
          <option value="">Example or puzzle&hellip;</option>
          <option value="own">Write your own</option>
          <optgroup id="puzzles" label="New puzzles" hidden></optgroup>
          <optgroup id="past" label="Past puzzles" hidden></optgroup>
          <optgroup id="practice" label="Practice puzzles"></optgroup>
          <optgroup id="examples" label="Examples"></optgroup>
        </select>
      </label>
      <span id="status" class="status ready" role="status">ready</span>
      <button id="theme" class="icon" type="button" aria-label="Switch between light and dark" title="Switch between light and dark">
        <svg class="moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <svg class="sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </header>

    <main id="main">
      <div id="content" class="content">
        <section class="hero" aria-label="Prompt">
          <h1 class="wordmark"><img class="mascot" src="../images/mascot.png" alt="" width="470" height="706">Bo <span>Playground</span></h1>
          <div id="version" class="runtime"></div>
          <div id="puzzle-goal" hidden></div>
          <form id="repl" class="prompt" autocomplete="off">
            <button id="plus" class="plus" type="button" aria-label="More actions" title="More actions">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
            </button>
            <input id="repl-input" aria-label="Bo code" spellcheck="false" autocomplete="off" autofocus
                   placeholder="Type some Bo, for example 1 2 +">
            <button id="send" class="send" aria-label="Run" title="Run (Enter)">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div id="menu" class="menu" role="menu" aria-label="More actions" hidden>
              <button role="menuitem" data-action="onboarding">Start here: a quick tour</button>
              <button role="menuitem" data-action="upload">Upload a file as standard input&hellip;</button>
              <button role="menuitem" data-action="clear" title="Starts over: a fresh machine, with the stacks, output, editor, standard input, picker and puzzle all cleared. Choose an example again to bring it back.">Reset everything</button>
              <button role="menuitemcheckbox" aria-checked="false" data-action="fast" id="menu-fast"
                      title="Run starts the program on a fresh machine without the stepper: faster, but it cannot be paused (Stop restarts the machine). Used when no program is loaded in the stepper.">
                <span class="check" aria-hidden="true"></span>Fast run
              </button>
              <button role="menuitem" data-action="editor" id="menu-editor">Show editor</button>
              <button role="menuitem" data-action="share" title="Copies a link that opens the editor's program and the standard input text">Share the editor's program&hellip;</button>
            </div>
          </form>
          <div id="onboarding-invite" class="onboarding-invite" hidden>
            <button id="onboarding-start" class="link" type="button">Need help? Start here</button>
          </div>
          <input id="upload" type="file" hidden>
          <div id="echo" class="echo" hidden></div>
          <div id="output" class="output-box" aria-live="polite" hidden></div>
          <div id="clear-row" class="clear-row" hidden><button id="clear" class="link" type="button">Clear</button></div>
        </section>

        <section id="stacks-section" class="stacks-section" aria-label="Stacks">
          <h2 id="stacks-heading" hidden>Stacks</h2>
          <div id="stacks"></div>
          <details id="stdin-box" class="drawer">
            <summary>Standard input</summary>
            <textarea id="stdin" rows="4" spellcheck="false" placeholder="Text the program reads from standard input"></textarea>
            <div class="editor-foot"><button id="stdin-clear" class="link" type="button" title="Empty the standard input">Clear</button></div>
          </details>
          <details id="library-box" class="drawer library-box">
            <summary>Library and kernel stacks</summary>
            <input id="library-filter" type="search" spellcheck="false" placeholder="Search by name, e.g. map" aria-label="Search library stacks">
            <div id="library"></div>
          </details>
        </section>
      </div>
    </main>
  </div>
</div>

<div id="onboarding-arrow" class="onboarding-arrow" aria-hidden="true" hidden>
  <svg viewBox="0 0 40 24"><path d="M 2 12 L 16 2 L 16 8 L 38 8 L 38 16 L 16 16 L 16 22 Z"/></svg>
</div>
<aside id="onboarding" class="onboarding" aria-label="Playground guide" aria-live="polite" hidden>
  <button id="onboarding-dismiss" class="onboarding-close" type="button" aria-label="Dismiss guide">&times;</button>
  <p id="onboarding-progress" class="onboarding-progress"></p>
  <h2 id="onboarding-title"></h2>
  <p id="onboarding-body" class="onboarding-body"></p>
  <div class="onboarding-actions">
    <button id="onboarding-helper" type="button" hidden></button>
    <button id="onboarding-skip" class="link" type="button">Skip tour</button>
    <button id="onboarding-back" type="button" hidden>Previous</button>
    <button id="onboarding-next" class="primary" type="button">Next</button>
  </div>
</aside>

<div id="toast" class="toast" role="status" hidden></div>
<script type="module" src="app.mjs"></script>
</body>
</html>
