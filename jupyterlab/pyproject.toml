[build-system]
requires = ["hatch-jupyter-builder>=0.5", "hatch-nodejs-version>=0.3.2", "hatchling>=1.5"]
build-backend = "hatchling.build"

[project]
name = "bo-jupyterlab"
description = "CodeMirror syntax highlighting for Bo in JupyterLab"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Programming Language :: Python :: 3"
]
dynamic = ["version"]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.build.targets.wheel.shared-data]
"bo_jupyterlab/labextension" = "share/jupyter/labextensions/bo-jupyterlab"
"install.json" = "share/jupyter/labextensions/bo-jupyterlab/install.json"

[tool.hatch.build.hooks.version]
path = "bo_jupyterlab/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["npm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["npm"]
source_dir = "src"
build_dir = "bo_jupyterlab/labextension"
